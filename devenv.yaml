# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    # url: github:cachix/devenv-nixpkgs/rolling # outdated
    url: github:nixos/nixpkgs/nixpkgs-unstable

allowUnfree: true

permittedInsecurePackages: []

imports: []

clean:
  enabled: false
  keep:
    - CACHIX_AUTH_TOKEN
    - EDITOR
    - GITHUB_TOKEN
    - HOME
    - PULUMI_ACCESS_TOKEN
