[default]

locale = "en-au"

extend-ignore-re = [
    "^[ \t]*-----BEGIN PGP PUBLIC KEY BLOCK-----.*^[ \t]*-----END PGP PUBLIC KEY BLOCK-----",
    "^[ \t]*initialHashedPassword[ \t]*=[ \t]*.*$"
]

[default.extend-words]

ags = "ags"
authorised = "authorised"
authorized = "authorized"
analyze = "analyze"
analyzed = "analyzed"
analyzing = "analyzing"
center = "center"
cros = "cros"
customizations = "customizations"
guage = "guage"
hashi = "hashi"
hashicorp = "hashicorp"
initialize = "initialize"
initialzed = "initialzed"
initializing = "initializing"
hda = "hda"
maximize = "maximize"
normalization = "normalization"
optimizations = "optimizations"
optimized = "optimized"
randomize = "randomize"
randomized = "randomized"
recognize = "recognize"
specializing = "specializing"
synchronize = "synchronize"
utilize = "utilize"
prioritize = "prioritize"

[files]

ignore-vcs = true

extend-exclude = [
  "*.drawio",
  ".devenv",
  ".direnv",
  ".git",
  "secrets",
  "vendor"
]
